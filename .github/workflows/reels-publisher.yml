name: Otomatik Instagram Reels Yayıncısı

on:
  schedule:
    # Türkiye Saati (TSİ = UTC+3) — Günde 3 Gönderi (Öğlen 13:00, İkindi 17:00, Akşam 21:00):
    - cron: '0 10,14,18 * * *'
  workflow_dispatch: # GitHub üzerinden istenildiği an tek tıkla test etme butonu

concurrency:
  group: reels-publisher
  cancel-in-progress: false

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Node.js 20 Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: FFmpeg Kur (Remotion İçin)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Jitter ile Rastgele Saatte Üret ve Yayınla
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node scripts/jitterRunner.mjs
