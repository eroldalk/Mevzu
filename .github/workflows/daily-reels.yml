name: 🚀 Mevzu Günlük Reels Otomasyonu

on:
  # Günde 2 Kez Otomatik Çalışma (Türkiye Saati: UTC+3)
  # 06:00 UTC = 09:00 Türkiye Saati (Sabah Gönderisi)
  # 17:00 UTC = 20:00 Türkiye Saati (Akşam Gönderisi)
  schedule:
    # --- PEŞ PEŞE CANLI TEST ZAMANLAMALARI (Gözlemlemek İçin) ---
    # 20:20 UTC = 23:20 TR (10 dk sonra)
    - cron: "20 20 * * *"
    # 20:25 UTC = 23:25 TR (15 dk sonra)
    - cron: "25 20 * * *"
    # 20:30 UTC = 23:30 TR (20 dk sonra)
    - cron: "30 20 * * *"
    # 20:40 UTC = 23:40 TR (30 dk sonra)
    - cron: "40 20 * * *"
    # 20:50 UTC = 23:50 TR (40 dk sonra)
    - cron: "50 20 * * *"

    # --- GÜNLÜK 4 ANA YAYIN SAATİ (Türkiye Saati: UTC+3) ---
    # 06:00 UTC = 09:00 TR (Sabah)
    - cron: "0 6 * * *"
    # 09:00 UTC = 12:00 TR (Öğle)
    - cron: "0 9 * * *"
    # 16:00 UTC = 19:00 TR (Akşam)
    - cron: "0 16 * * *"
    # 18:30 UTC = 21:30 TR (Gece Altın Saat)
    - cron: "30 18 * * *"

  # GitHub Paneli Üzerinden "Run Workflow" Butonuyla İstenildiği An Manuel Tetikleme
  workflow_dispatch:

jobs:
  render-and-publish:
    name: 🎬 Render & Canlı Reels Yayınla
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Depoyu Klonla
        uses: actions/checkout@v4

      - name: 🟢 Node.js Ortamını Hazırla
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 NPM Bağımlılıklarını Kur
        run: npm install

      - name: 🌐 Remotion Tarayıcı Motorunu Hazırla
        run: npx remotion browser ensure

      - name: 🚀 Mevzu Otomasyon Motorunu Çalıştır (Firestore + Remotion + Instagram)
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: node scripts/renderAndPublish.mjs

      - name: 💾 Üretilen Video ve Kapağı Yedekle (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mevzu-reels-output-${{ github.run_id }}
          path: |
            output/*.mp4
            output/*.jpg
          retention-days: 14
