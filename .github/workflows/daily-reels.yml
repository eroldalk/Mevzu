name: 🚀 Mevzu Günlük Reels Otomasyonu

on:
  # Günde 2 Kez Otomatik Çalışma (Türkiye Saati: UTC+3)
  # 06:00 UTC = 09:00 Türkiye Saati (Sabah Gönderisi)
  # 17:00 UTC = 20:00 Türkiye Saati (Akşam Gönderisi)
  schedule:
    # --- KESİNTİSİZ NÖBETÇİ CRON (Her 15 Dakikada Bir Uyanır) ---
    # :00, :15, :30, :45 dakikalarında kontrol eder.
    # Hedef slot saatleri (08:30, 11:00, 13:30, 16:30, 19:30, 22:00) tam :00 ve :30 dakikalarındadır.
    # Böylece her slot tam vaktinde tetiklenir ve asla erken yayın yapmaz.
    - cron: '0,15,30,45 * * * *'

  # GitHub Paneli Üzerinden "Run Workflow" Butonuyla İstenildiği An Manuel Tetikleme
  workflow_dispatch:

jobs:
  render-and-publish:
    name: 🎬 Render & Canlı Reels Yayınla
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Depoyu Klonla
        uses: actions/checkout@v4

      - name: 🟢 Node.js Ortamını Hazırla
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 NPM Bağımlılıklarını Kur (Temiz Kurulum)
        run: npm ci

      - name: 🌐 Remotion Tarayıcı Motorunu Hazırla
        run: npx remotion browser ensure

      - name: 🚀 Mevzu Otomasyon Motorunu Çalıştır (Firestore + Remotion + Instagram)
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/renderAndPublish.mjs

      - name: 💾 Üretilen Video ve Kapağı Yedekle (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mevzu-reels-output-${{ github.run_id }}
          path: |
            output/*.mp4
            output/*.jpg
          retention-days: 14
