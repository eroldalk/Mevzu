name: 🚀 Mevzu Günlük Reels Otomasyonu

on:
  # Günde 2 Kez Otomatik Çalışma (Türkiye Saati: UTC+3)
  # 06:00 UTC = 09:00 Türkiye Saati (Sabah Gönderisi)
  # 17:00 UTC = 20:00 Türkiye Saati (Akşam Gönderisi)
  schedule:
    # --- GÜNLÜK 6 ALTIN YAYIN SAATİ (Jitter & Akıllı Tolerans Uyumlu - TR: UTC+3) ---
    # 05:24 UTC = 08:24 TR -> 08:25 - 08:34 arası rastgele (Sabah Kahvesi)
    - cron: '24 5 * * *'
    # 07:54 UTC = 10:54 TR -> 10:55 - 11:04 arası rastgele (İş Öncesi Motivasyon)
    - cron: '54 7 * * *'
    # 10:24 UTC = 13:24 TR -> 13:25 - 13:34 arası rastgele (Öğle Molası)
    - cron: '24 10 * * *'
    # 13:24 UTC = 16:24 TR -> 16:25 - 16:34 arası rastgele (İkindi Molası)
    - cron: '24 13 * * *'
    # 16:24 UTC = 19:24 TR -> 19:25 - 19:34 arası rastgele (Akşam Dönüşü)
    - cron: '24 16 * * *'
    # 18:54 UTC = 21:54 TR -> 21:55 - 22:04 arası rastgele (Gece Derin Düşünce)
    - cron: '54 18 * * *'

  # GitHub Paneli Üzerinden "Run Workflow" Butonuyla İstenildiği An Manuel Tetikleme
  workflow_dispatch:

jobs:
  render-and-publish:
    name: 🎬 Render & Canlı Reels Yayınla
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Depoyu Klonla
        uses: actions/checkout@v4

      - name: 🟢 Node.js Ortamını Hazırla
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 NPM Bağımlılıklarını Kur
        run: npm install

      - name: 🌐 Remotion Tarayıcı Motorunu Hazırla
        run: npx remotion browser ensure

      - name: 🚀 Mevzu Otomasyon Motorunu Çalıştır (Firestore + Remotion + Instagram)
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: node scripts/renderAndPublish.mjs

      - name: 💾 Üretilen Video ve Kapağı Yedekle (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mevzu-reels-output-${{ github.run_id }}
          path: |
            output/*.mp4
            output/*.jpg
          retention-days: 14
