name: 🚀 Mevzu Günlük Reels Otomasyonu

on:
  # Dinamik Otomasyon Nöbetçisi (Türkiye Saati: UTC+3)
  # Siteden kaydettiğiniz saatleri (Reels ve 08:00 Sabah Hikayesi) otomatik yakalar.
  # Gece Asla Çalışmaz! Yalnızca 08:00 - 23:00 Türkiye saatleri arasında uyanır (05:00 - 20:00 UTC).
  # Belirlediğiniz saat gelmediyse veya gönderi zaten atıldıysa 2 saniyede kendini kapatır.
  schedule:
    - cron: '0,30 5-20 * * *'

  # GitHub Paneli Üzerinden "Run Workflow" Butonuyla İstenildiği An Manuel Tetikleme
  workflow_dispatch:

jobs:
  render-and-publish:
    name: 🎬 Render & Canlı Reels Yayınla
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Depoyu Klonla
        uses: actions/checkout@v4

      - name: 🟢 Node.js Ortamını Hazırla
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 NPM Bağımlılıklarını Kur (Temiz Kurulum)
        run: npm ci

      - name: 🌐 Remotion Tarayıcı Motorunu Hazırla
        run: npx remotion browser ensure

      - name: 🚀 Mevzu Otomasyon Motorunu Çalıştır (Firestore + Remotion + Instagram)
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/renderAndPublish.mjs

      - name: 💾 Üretilen Video ve Kapağı Yedekle (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mevzu-reels-output-${{ github.run_id }}
          path: |
            output/*.mp4
            output/*.jpg
          retention-days: 14
